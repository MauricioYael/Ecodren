<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página no encontrada | ECODREN</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .error-container { 
            height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center;
            background: #0a0a0a; color: white; padding: 20px;
        }
        .error-code { font-size: 8rem; font-family: 'Syne', sans-serif; color: var(--eco-lime); }
        .error-msg { font-size: 1.5rem; margin-bottom: 20px; }
        .back-btn { 
            padding: 12px 30px; background: var(--eco-lime); color: black; 
            text-decoration: none; font-weight: 700; border-radius: 5px; 
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-msg">Parece que la ruta que buscas no existe en nuestra red de drenaje.</p>
        <a href="index.html" class="back-btn">Volver al Inicio</a>
    </div>
</body>
</html>
